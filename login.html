<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-fintech">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <section class="card shadow-lg border-0 rounded-4">
          <header class="card-header bg-white border-0 pt-4 text-center">
            <h1 class="h3 fw-bold text-primary">Alke Wallet</h1>
            <p class="text-muted">Inicio de sesión seguro</p>
          </header>
          <div class="card-body p-4">
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="frida@alkewallet.cl" required>
                <div class="invalid-feedback">Ingrese un correo válido.</div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="6">
                <div class="invalid-feedback">Mínimo 6 caracteres.</div>
              </div>
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Ingresar</button>
              </div>
              <div id="loginAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>
            </form>
            <nav class="mt-4 text-center">
              <a href="index.html" class="small text-decoration-none">← Volver a inicio</a>
            </nav>
          </div>
        </section>
      </div>
    </div>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Retiro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
  <header>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="menu.html">Alke Wallet</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="deposit.html">Depositar</a></li>
            <li class="nav-item"><a class="nav-link active" href="withdraw.html">Retirar</a></li>
            <li class="nav-item"><a class="nav-link" href="sendmoney.html">Enviar Dinero</a></li>
            <li class="nav-item"><a class="nav-link" href="transactions.html">Movimientos</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="login.html" id="logoutBtn">Cerrar sesión</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <section class="mb-4">
          <h1 class="h4">Retirar fondos</h1>
          <p class="text-muted">Simule un retiro y actualice el saldo de su billetera.</p>
        </section>
        <article class="card border-0 shadow-sm rounded-4 mb-4 card-balance">
          <div class="card-body d-flex justify-content-between align-items-center">
            <div><h2 class="h6 text-white-50">Saldo disponible</h2><p class="h3 fw-bold m-0" id="saldoActualWithdraw">$ 0</p></div>
            <i class="bi bi-cash-stack fs-1 opacity-50"></i>
          </div>
        </article>
        <section class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-4">
            <form id="withdrawForm" novalidate>
              <div class="mb-3">
                <label for="montoRetiro" class="form-label">Monto a retirar (CLP)</label>
                <input type="number" class="form-control form-control-lg" id="montoRetiro" min="1000" step="1000" required>
                <div class="invalid-feedback">Ingrese un monto entero mínimo de $1.000.</div>
              </div>
              <div class="mb-3">
                <label for="metodoRetiro" class="form-label">Destino del retiro</label>
                <select class="form-select" id="metodoRetiro" required>
                  <option value="">Seleccione...</option>
                  <option value="cuenta bancaria">Cuenta bancaria</option>
                  <option value="caja presencial">Caja presencial</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-dash-circle"></i> Realizar retiro</button>
              <div id="withdrawMsg" class="alert mt-3 d-none"></div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/withdraw.js"></script>
</body>
</html>
